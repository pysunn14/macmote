name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcrun --find swiftc && swiftc --version
          /usr/bin/python3 --version
          node --version
      - name: Checks
        run: sh scripts/ci.sh
      - name: Keep the built helpers for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          if-no-files-found: ignore
